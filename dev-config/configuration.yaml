# A throwaway Home Assistant for developing the integration.
# It has no connection to any other Home Assistant instance.
homeassistant:
  name: Atrea dev

frontend:
config:
history:
logbook:
diagnostics:

# A room temperature to send to the unit in tests (integration options,
# "Room temperature sensor"). Change it with the input number.
input_number:
  atrea_test_room:
    name: Atrea test room value
    min: 15
    max: 30
    step: 0.1
    initial: 23.6
    unit_of_measurement: "°C"

template:
  - sensor:
      - name: Atrea test room
        unique_id: atrea_test_room
        unit_of_measurement: "°C"
        device_class: temperature
        state: "{{ states('input_number.atrea_test_room') }}"

logger:
  default: warning
  logs:
    custom_components.atrea: debug
    modbus_connection: info
